<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Campus Navigator</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    canvas {
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-sm">
          <i class="fa-solid fa-compass text-xl"></i>
        </div>

        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">
            School Campus Navigator
          </h1>
          <p class="text-xs text-slate-500">
            Interactive Map & Visual Walking Directions
          </p>
        </div>
      </div>

      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
        <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span>
        Gate 2 Open
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4 w-full flex-grow flex flex-col gap-4">

    <!-- Navigation Panel -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">

        <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-3">

          <!-- Starting Point -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
              Starting Point
            </label>

            <div class="relative flex items-center">
              <i class="fa-solid fa-location-dot absolute left-3 text-emerald-600"></i>

              <select id="startSelect" onchange="onSelectionChange()"
                class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                <option value="" disabled selected>Select starting point...</option>
                <option value="gate2">Gate 2 (Main Entrance)</option>
                <option value="bigHall">Mary Ward Hall</option>
                <option value="newHall">Delphine Hart Hall</option>
                <option value="languages">Languages</option>
                <option value="art">Art</option>
                <option value="chemistry">Chemistry</option>
                <option value="history">History</option>
              </select>

              <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- Destination -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
              Destination
            </label>

            <div class="relative flex items-center">
              <i class="fa-solid fa-flag-checkered absolute left-3 text-rose-600"></i>

              <select id="endSelect" onchange="onSelectionChange()"
                class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                <option value="" disabled selected>Select destination...</option>
                <option value="bigHall">Mary Ward Hall</option>
                <option value="newHall">Delphine Hart Hall</option>
                <option value="languages">Languages</option>
                <option value="art">Art</option>
                <option value="chemistry">Chemistry</option>
                <option value="history">History</option>
                <option value="gate2">Gate 2 (Main Entrance)</option>
              </select>

              <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
            </div>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex items-end gap-2 pt-1 md:pt-0">
          <button id="showPathBtn" onclick="calculateRoute()"
            class="flex-1 md:flex-initial px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-route"></i>
            <span>Show Route</span>
          </button>

          <button id="takeMeBtn" onclick="openStepViewer()" disabled
            class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-shoe-prints"></i>
            <span>Take Me (Photo Guide)</span>
          </button>
        </div>
      </div>

      <!-- Alert -->
      <div id="msgBox"
        class="hidden mt-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-amber-600"></i>
        <span id="msgText">Please select two different locations.</span>
      </div>
    </div>

    <!-- Map -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden flex-grow flex items-center justify-center min-h-[460px]">
      <canvas id="campusCanvas" width="800" height="520"
        class="max-w-full rounded-xl bg-slate-50 border border-slate-100">
      </canvas>
    </div>
  </main>

  <!-- Photo Guide Modal -->
  <div id="photoModal"
    class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

    <div class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <h3 id="modalTitle" class="font-bold text-slate-900 text-base">
            Route Navigation
          </h3>
          <p id="modalSubtitle" class="text-xs text-slate-500">
            Step 1 of 3
          </p>
        </div>

        <button onclick="closeStepViewer()"
          class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-5 flex-grow overflow-y-auto flex flex-col gap-4">

        <div class="relative w-full h-64 sm:h-80 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center">
          <img id="modalImg" src="" alt="Route step visual"
            class="w-full h-full object-cover">
          <span id="imagePlaceholder" class="absolute text-sm text-slate-400 font-medium pointer-events-none">
            Add image path for this step
          </span>
        </div>

        <div class="p-4 bg-blue-50/70 rounded-2xl border border-blue-100 flex items-start gap-3">
          <div class="bg-blue-600 text-white rounded-xl w-8 h-8 flex-shrink-0 flex items-center justify-center font-bold text-sm">
            <span id="stepNumber">1</span>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 text-sm mb-0.5">Instruction</h4>
            <p id="modalInstruction" class="text-sm text-slate-700 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-100 flex items-center justify-between bg-white">
        <button id="prevStepBtn" onclick="changeStep(-1)"
          class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Previous
        </button>

        <span id="stepCounterText" class="text-xs font-semibold text-slate-400">
          Step 1 / 3
        </span>

        <button id="nextStepBtn" onclick="changeStep(1)"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl flex items-center gap-2">
          Next <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('campusCanvas');
  const ctx = canvas.getContext('2d');

  const TOP_CORRIDOR_Y = 114;
  const LOWER_PASSAGE_Y = 305;
  const EAST_LOOP_X = 470;

  const locs = {
    gate2: { name: "Gate 2", x: 95, y: 35 },
    gate3: { name: "Gate 3 (Closed)", x: 665, y: 35 },
    bigHall: { name: "Mary Ward Hall", x: 290, y: 227 },
    newHall: { name: "Delphine Hart Hall", x: 82, y: 400 },
    languages: { name: "Languages", x: 440, y: 72 },
    art: { name: "Art", x: 505, y: 72 },
    chemistry: { name: "Chemistry", x: 565, y: 72 },
    history: { name: "History", x: 625, y: 72 }
  };

  let activePoints = [];
  let activeRouteSteps = [];
  let currentStepIdx = 0;
  let animFrame = null;

  function drawCampusMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = '#db2777';
    ctx.lineWidth = 4;
    ctx.strokeRect(15, 15, 770, 490);

    ctx.fillStyle = '#2563eb';
    ctx.fillRect(65, 10, 60, 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Inter, sans-serif';
    ctx.fillText('Gate 2', 76, 30);

    ctx.fillStyle = '#64748b';
    ctx.fillRect(635, 10, 60, 30);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 11px Inter, sans-serif';
    ctx.fillText('Gate 3', 646, 24);
    ctx.font = '8px Inter, sans-serif';
    ctx.fillText('(Closed)', 648, 34);

    ctx.fillStyle = '#fcf2f6';
    ctx.strokeStyle = '#db2777';
    ctx.lineWidth = 2.5;
    ctx.fillRect(140, 50, 545, 42);
    ctx.strokeRect(140, 50, 545, 42);

    ctx.fillStyle = '#db2777';
    ctx.font = 'bold 12px Inter, sans-serif';
    ctx.fillText('Block A Corridor', 185, 76);

    const rooms = [
      { name: 'Languages', x: 410, w: 60 },
      { name: 'Art', x: 475, w: 55 },
      { name: 'Chemistry', x: 535, w: 65 },
      { name: 'History', x: 605, w: 70 }
    ];

    rooms.forEach(room => {
      ctx.strokeStyle = '#db2777';
      ctx.strokeRect(room.x, 50, room.w, 42);
      ctx.fillStyle = '#9d174d';
      ctx.font = 'bold 10px Inter, sans-serif';
      ctx.fillText(room.name, room.x + 6, 75);
    });

    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 2;
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(295, 96, 45, 20);
    ctx.strokeRect(295, 96, 45, 20);

    for (let sx = 302; sx < 338; sx += 7) {
      ctx.beginPath();
      ctx.moveTo(sx, 96);
      ctx.lineTo(sx, 116);
      ctx.stroke();
    }

    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 8px Inter, sans-serif';
    ctx.fillText('Outdoor Stairs', 296, 109);

    ctx.fillStyle = '#fce7f3';
    ctx.strokeStyle = '#db2777';
    ctx.lineWidth = 2.5;
    ctx.fillRect(170, 160, 240, 135);
    ctx.strokeRect(170, 160, 240, 135);

    ctx.strokeRect(265, 152, 40, 8);
    ctx.fillRect(265, 152, 40, 8);
    ctx.strokeRect(265, 295, 40, 8);
    ctx.fillRect(265, 295, 40, 8);

    ctx.fillStyle = '#9d174d';
    ctx.font = 'bold 14px Inter, sans-serif';
    ctx.fillText('Mary Ward Hall', 225, 220);

    ctx.strokeStyle = '#db2777';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = '#fce7f3';
    ctx.fillRect(30, 310, 125, 180);
    ctx.strokeRect(30, 310, 125, 180);

    ctx.strokeRect(155, 345, 8, 30);
    ctx.fillRect(155, 345, 8, 30);

    ctx.fillStyle = '#fbcfe8';
    ctx.fillRect(40, 375, 105, 105);
    ctx.strokeRect(40, 375, 105, 105);

    ctx.fillStyle = '#9d174d';
    ctx.font = 'bold 12px Inter, sans-serif';
    ctx.fillText('Delphine Hart', 48, 420);
    ctx.fillText('Hall', 75, 438);

    ctx.strokeStyle = '#16a34a';
    ctx.lineWidth = 2.5;
    ctx.fillStyle = '#dcfce7';
    ctx.fillRect(180, 320, 210, 150);
    ctx.strokeRect(180, 320, 210, 150);

    ctx.fillStyle = '#15803d';
    ctx.font = 'bold 14px Inter, sans-serif';
    ctx.fillText('Playground', 245, 400);

    ctx.fillStyle = '#dcfce7';
    ctx.fillRect(400, 345, 100, 125);
    ctx.strokeRect(400, 345, 100, 125);

    ctx.fillStyle = '#15803d';
    ctx.font = 'bold 11px Inter, sans-serif';
    ctx.fillText('Playground', 410, 410);

    ctx.strokeStyle = '#db2777';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(530, 180, 130, 140);
    ctx.strokeRect(530, 180, 130, 140);

    ctx.fillStyle = '#9d174d';
    ctx.font = 'bold 15px Inter, sans-serif';
    ctx.fillText('Block B', 565, 255);

    ctx.strokeStyle = '#ea580c';
    ctx.fillStyle = '#ffedd5';
    ctx.fillRect(540, 355, 120, 90);
    ctx.strokeRect(540, 355, 120, 90);

    ctx.fillStyle = '#c2410c';
    ctx.font = 'bold 13px Inter, sans-serif';
    ctx.fillText('Canteen', 575, 405);

    if (activePoints.length > 1) {
      ctx.beginPath();
      ctx.moveTo(activePoints[0].x, activePoints[0].y);

      for (let i = 1; i < activePoints.length; i++) {
        ctx.lineTo(activePoints[i].x, activePoints[i].y);
      }

      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 6]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(activePoints[0].x, activePoints[0].y, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#16a34a';
      ctx.fill();

      const last = activePoints[activePoints.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#dc2626';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function buildRoute(start, end) {
    const p1 = locs[start];
    const p2 = locs[end];

    if (start === 'gate2' && end === 'bigHall') {
      return [
        { x: 95, y: 55 },
        { x: 95, y: TOP_CORRIDOR_Y },
        { x: 290, y: TOP_CORRIDOR_Y },
        { x: 290, y: 160 }
      ];
    }

    // Delphine Hart Hall <-> Gate 2 (updated per first picture)
    if ((start === 'gate2' && end === 'newHall') || (start === 'newHall' && end === 'gate2')) {
      const route = [
        { x: 80, y: 40 },
        { x: 80, y: 135 },
        { x: 477, y: 135 },
        { x: 477, y: LOWER_PASSAGE_Y },
        { x: 163, y: LOWER_PASSAGE_Y },
        { x: 163, y: 360 }
      ];
      return start === 'gate2' ? route : [...route].reverse();
    }

    // Delphine Hart Hall <-> Mary Ward Hall (updated per second picture)
    if ((start === 'bigHall' && end === 'newHall') || (start === 'newHall' && end === 'bigHall')) {
      const route = [
        { x: 163, y: 360 },
        { x: 163, y: LOWER_PASSAGE_Y },
        { x: 460, y: LOWER_PASSAGE_Y },
        { x: 460, y: 143 },
        { x: 252, y: 143 },
        { x: 250, y: 182 }
      ];
      return start === 'newHall' ? route : [...route].reverse();
    }

    if (start === 'newHall' && ['languages', 'art', 'chemistry', 'history'].includes(end)) {
      return [
        { x: 163, y: 360 },
        { x: 163, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: 92 }
      ];
    }

    if (end === 'newHall' && ['languages', 'art', 'chemistry', 'history'].includes(start)) {
      return [
        { x: p1.x, y: 92 },
        { x: p1.x, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: 163, y: LOWER_PASSAGE_Y },
        { x: 163, y: 360 }
      ];
    }

    if (start === 'gate2' && ['languages', 'art', 'chemistry', 'history'].includes(end)) {
      return [
        { x: 95, y: 55 },
        { x: 95, y: 72 },
        { x: p2.x, y: 72 }
      ];
    }

    if (start === 'bigHall' && ['languages', 'art', 'chemistry', 'history'].includes(end)) {
      return [
        { x: 290, y: 160 },
        { x: 290, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: 92 }
      ];
    }

    if (end === 'bigHall' && ['languages', 'art', 'chemistry', 'history'].includes(start)) {
      return [
        { x: p1.x, y: 92 },
        { x: p1.x, y: TOP_CORRIDOR_Y },
        { x: 290, y: TOP_CORRIDOR_Y },
        { x: 290, y: 160 }
      ];
    }

    return [
      { x: p1.x, y: p1.y },
      { x: p1.x, y: TOP_CORRIDOR_Y },
      { x: p2.x, y: TOP_CORRIDOR_Y },
      { x: p2.x, y: p2.y }
    ];
  }

  // Short names used in the image file names.
  const imgNames = {
    gate2: "gate2",
    bigHall: "maryward",
    newHall: "delphine",
    languages: "languages",
    art: "art",
    chemistry: "chemistry",
    history: "history"
  };

  // Creates photo-guide steps with image paths already filled in.
  // Example: imageSteps("gate2", "newHall", 5) ->
  //   images/gate2-to-delphine-1.jpg ... images/gate2-to-delphine-5.jpg
  // Type the directions into text: "" later if you want them.
  function imageSteps(start, end, count) {
    return Array.from({ length: count }, (_, i) => ({
      image: `images/${imgNames[start]}-to-${imgNames[end]}-${i + 1}.jpg`,
      fallbackText: "",
      text: ""
    }));
  }

  // Picture counts supplied for each directed route.
  // Mary Ward Hall -> Gate 2 was not assigned a picture count, so it is omitted for now.
  const routePhotoGuides = {
    // GATE 2
    "gate2->bigHall": imageSteps("gate2", "bigHall", 4),
    "gate2->newHall": imageSteps("gate2", "newHall", 5),
    "gate2->languages": imageSteps("gate2", "languages", 3),
    "gate2->art": imageSteps("gate2", "art", 4),
    "gate2->chemistry": imageSteps("gate2", "chemistry", 5),
    "gate2->history": imageSteps("gate2", "history", 6),

    // MARY WARD HALL
    "bigHall->newHall": imageSteps("bigHall", "newHall", 5),

    // DELPHINE HART HALL
    "newHall->bigHall": imageSteps("newHall", "bigHall", 5),
    "newHall->languages": imageSteps("newHall", "languages", 7),
    "newHall->art": imageSteps("newHall", "art", 8),
    "newHall->chemistry": imageSteps("newHall", "chemistry", 9),
    "newHall->history": imageSteps("newHall", "history", 10),
    "newHall->gate2": imageSteps("newHall", "gate2", 5),

    // LANGUAGES
    "languages->newHall": imageSteps("languages", "newHall", 6),
    "languages->bigHall": imageSteps("languages", "bigHall", 3),
    "languages->history": imageSteps("languages", "history", 2),
    "languages->chemistry": imageSteps("languages", "chemistry", 2),
    "languages->art": imageSteps("languages", "art", 2),
    "languages->gate2": imageSteps("languages", "gate2", 2),

    // HISTORY
    "history->newHall": imageSteps("history", "newHall", 5),
    "history->bigHall": imageSteps("history", "bigHall", 3),
    "history->gate2": imageSteps("history", "gate2", 1),
    "history->chemistry": imageSteps("history", "chemistry", 2),
    "history->art": imageSteps("history", "art", 2),
    "history->languages": imageSteps("history", "languages", 2),

    // CHEMISTRY
    "chemistry->newHall": imageSteps("chemistry", "newHall", 5),
    "chemistry->bigHall": imageSteps("chemistry", "bigHall", 2),
    "chemistry->history": imageSteps("chemistry", "history", 2),
    "chemistry->art": imageSteps("chemistry", "art", 2),
    "chemistry->languages": imageSteps("chemistry", "languages", 2),
    "chemistry->gate2": imageSteps("chemistry", "gate2", 2),

    // ART
    "art->bigHall": imageSteps("art", "bigHall", 3),
    "art->newHall": imageSteps("art", "newHall", 5),
    "art->gate2": imageSteps("art", "gate2", 2),
    "art->history": imageSteps("art", "history", 2),
    "art->languages": imageSteps("art", "languages", 2),
    "art->chemistry": imageSteps("art", "chemistry", 2)
  };

  // These original Mary Ward Hall images are retained exactly as requested.
  // Each route adds the next destination doorway image to the previous sequence.
  const maryWardImages = {
    languages: [
      "images/maryward-courtyard.jpg",
      "images/block-a-entry.jpg",
      "images/language-doorway.jpg"
    ],
    art: [
      "images/maryward-courtyard.jpg",
      "images/block-a-entry.jpg",
      "images/language-doorway.jpg",
      "images/art-doorway.jpg"
    ],
    chemistry: [
      "images/maryward-courtyard.jpg",
      "images/block-a-entry.jpg",
      "images/language-doorway.jpg",
      "images/art-doorway.jpg",
      "images/chemistry-doorway.jpg"
    ],
    history: [
      "images/maryward-courtyard.jpg",
      "images/block-a-entry.jpg",
      "images/language-doorway.jpg",
      "images/art-doorway.jpg",
      "images/chemistry-doorway.jpg",
      "images/history-doorway.jpg"
    ]
  };

  function createSteps(start, end) {
    const routeKey = `${start}->${end}`;

    // Keep the original images for Mary Ward Hall -> Language, Art,
    // Chemistry and History. Directions remain blank for you to fill in.
    if (start === "bigHall" && maryWardImages[end]) {
      return maryWardImages[end].map(image => ({
        image,
        fallbackText: "",
        text: ""
      }));
    }

    return routePhotoGuides[routeKey] || [];
  }

  function onSelectionChange() {
    document.getElementById('takeMeBtn').disabled = true;
    document.getElementById('msgBox').classList.add('hidden');
  }

  function calculateRoute() {
    const start = document.getElementById('startSelect').value;
    const end = document.getElementById('endSelect').value;

    const msgBox = document.getElementById('msgBox');
    const msgText = document.getElementById('msgText');
    const takeMeBtn = document.getElementById('takeMeBtn');

    if (!start || !end) {
      msgText.innerText = 'Please select both a starting point and a destination.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
      activePoints = [];
      activeRouteSteps = [];
      drawCampusMap();
      return;
    }

    if (start === end) {
      msgText.innerText = 'Please select two different locations to calculate the route.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
      activePoints = [];
      activeRouteSteps = [];
      drawCampusMap();
      return;
    }

    let points = buildRoute(start, end);

    if (start !== 'gate2' && end !== 'gate2' &&
        start !== 'newHall' && end !== 'newHall' &&
        start !== 'bigHall' && end !== 'bigHall') {
      points = [
        { x: locs[start].x, y: locs[start].y },
        { x: locs[start].x, y: TOP_CORRIDOR_Y },
        { x: locs[end].x, y: TOP_CORRIDOR_Y },
        { x: locs[end].x, y: locs[end].y }
      ];
    }

    activePoints = points;
    activeRouteSteps = createSteps(start, end);

    if (activeRouteSteps.length === 0) {
      msgText.innerText = 'The photo-guide picture count for this route has not been set yet.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
    } else {
      msgBox.classList.add('hidden');
      takeMeBtn.disabled = false;
    }

    animatePath(points);
  }

  function animatePath(points) {
    if (animFrame) cancelAnimationFrame(animFrame);

    let segment = 0;
    let progress = 0;

    function step() {
      drawCampusMap();

      if (points.length < 2) return;

      if (segment < points.length - 1) {
        const p1 = points[segment];
        const p2 = points[segment + 1];

        const currX = p1.x + (p2.x - p1.x) * progress;
        const currY = p1.y + (p2.y - p1.y) * progress;

        ctx.beginPath();
        ctx.arc(currX, currY, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#2563eb';
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        progress += 0.04;

        if (progress >= 1) {
          progress = 0;
          segment++;
        }

        animFrame = requestAnimationFrame(step);
      } else {
        segment = 0;
        progress = 0;
        animFrame = requestAnimationFrame(step);
      }
    }

    step();
  }

  function openStepViewer() {
    if (!activeRouteSteps.length) return;

    currentStepIdx = 0;
    updateModalStep();

    const modal = document.getElementById('photoModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function closeStepViewer() {
    const modal = document.getElementById('photoModal');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
  }

  function changeStep(dir) {
    currentStepIdx += dir;

    if (currentStepIdx < 0) {
      currentStepIdx = 0;
    }

    if (currentStepIdx >= activeRouteSteps.length) {
      currentStepIdx = activeRouteSteps.length - 1;
    }

    updateModalStep();
  }

  function updateModalStep() {
    const step = activeRouteSteps[currentStepIdx];
    const startVal = document.getElementById('startSelect').value;
    const endVal = document.getElementById('endSelect').value;

    const startName = locs[startVal] ? locs[startVal].name : startVal;
    const endName = locs[endVal] ? locs[endVal].name : endVal;

    document.getElementById('modalTitle').innerText = `${startName} ➔ ${endName}`;
    document.getElementById('modalSubtitle').innerText = `Step ${currentStepIdx + 1} of ${activeRouteSteps.length}`;
    document.getElementById('stepNumber').innerText = currentStepIdx + 1;
    document.getElementById('modalInstruction').innerText = step.text || '';
    document.getElementById('stepCounterText').innerText = `Step ${currentStepIdx + 1} / ${activeRouteSteps.length}`;

    const imgEl = document.getElementById('modalImg');
    const placeholder = document.getElementById('imagePlaceholder');

    imgEl.onerror = null;
    imgEl.alt = step.fallbackText || 'Route step image';

    if (step.image) {
      imgEl.src = step.image;
      imgEl.classList.remove('hidden');
      placeholder.classList.add('hidden');
    } else {
      imgEl.removeAttribute('src');
      imgEl.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }

    document.getElementById('prevStepBtn').disabled = (currentStepIdx === 0);
    document.getElementById('nextStepBtn').disabled = (currentStepIdx === activeRouteSteps.length - 1);
  }

  window.onload = function() {
    drawCampusMap();
  };
</script>

</body>
</html>
