    <div>
      <h1 class="font-bold text-lg text-slate-900 leading-tight">
        School Campus Navigator
      </h1>
      <p class="text-xs text-slate-500">
        Interactive Map & Visual Walking Directions
      </p>
    </div>
  </div>

  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
    <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span>
    Gate 2 Open
  </span>
</div>


<!-- Navigation Control Panel -->
<div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
  <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">

    <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-3">

      <!-- Starting Point -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
          Starting Point
        </label>

        <div class="relative flex items-center">
          <i class="fa-solid fa-location-dot absolute left-3 text-emerald-600"></i>

          <select id="startSelect"
            class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
            <option value="gate2">Gate 2 (Main Entrance)</option>
            <option value="bigHall">Mary Ward Hall</option>
            <option value="newHall">Delphine Hart Hall</option>
            <option value="languages">Languages</option>
            <option value="art">Art</option>
            <option value="chemistry">Chemistry</option>
            <option value="history">History</option>
          </select>

          <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
        </div>
      </div>

      <!-- Destination -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
          Destination
        </label>

        <div class="relative flex items-center">
          <i class="fa-solid fa-flag-checkered absolute left-3 text-rose-600"></i>

          <select id="endSelect"
            class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
            <option value="bigHall">Mary Ward Hall</option>
            <option value="newHall" selected>Delphine Hart Hall</option>
            <option value="languages">Languages</option>
            <option value="art">Art</option>
            <option value="chemistry">Chemistry</option>
            <option value="history">History</option>
            <option value="gate2">Gate 2 (Main Entrance)</option>
          </select>

          <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-end gap-2 pt-1 md:pt-0">
      <button id="showPathBtn" onclick="calculateRoute()"
        class="flex-1 md:flex-initial px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-route"></i>
        <span>Show Route</span>
      </button>

      <button id="takeMeBtn" onclick="openStepViewer()" disabled
        class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-shoe-prints"></i>
        <span>Take Me (Photo Guide)</span>
      </button>
    </div>
  </div>

  <!-- Alert -->
  <div id="msgBox"
    class="hidden mt-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm flex items-center gap-2">
    <i class="fa-solid fa-circle-info text-amber-600"></i>
    <span id="msgText">Please select two different locations.</span>
  </div>
</div>

<!-- Campus Map Canvas -->
<div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden flex-grow flex items-center justify-center min-h-[460px]">
  <canvas id="campusCanvas" width="800" height="520"
    class="max-w-full rounded-xl bg-slate-50 border border-slate-100">
  </canvas>
</div>


<div class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

  <!-- Modal Header -->
  <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
    <div>
      <h3 id="modalTitle" class="font-bold text-slate-900 text-base">
        Route Navigation
      </h3>
      <p id="modalSubtitle" class="text-xs text-slate-500">
        Step 1 of 3
      </p>
    </div>

    <button onclick="closeStepViewer()"
      class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- Modal Body -->
  <div class="p-5 flex-grow overflow-y-auto flex flex-col gap-4">
    <div class="relative w-full h-64 sm:h-80 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center">
      <img id="modalImg" src="" alt="Route step visual" class="w-full h-full object-cover">
    </div>

    <div class="p-4 bg-blue-50/70 rounded-2xl border border-blue-100 flex items-start gap-3">
      <div class="bg-blue-600 text-white rounded-xl w-8 h-8 flex-shrink-0 flex items-center justify-center font-bold text-sm">
        <span id="stepNumber">1</span>
      </div>

      <div>
        <h4 class="font-bold text-slate-900 text-sm mb-0.5">Instruction</h4>
        <p id="modalInstruction" class="text-sm text-slate-700 leading-relaxed"></p>
      </div>
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="p-4 border-t border-slate-100 flex items-center justify-between bg-white">
    <button id="prevStepBtn" onclick="changeStep(-1)"
      class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl flex items-center gap-2">
      <i class="fa-solid fa-arrow-left"></i> Previous
    </button>

    <span id="stepCounterText" class="text-xs font-semibold text-slate-400">
      Step 1 / 3
    </span>

    <button id="nextStepBtn" onclick="changeStep(1)"
      class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl flex items-center gap-2">
      Next <i class="fa-solid fa-arrow-right"></i>
    </button>
  </div>
</div>
