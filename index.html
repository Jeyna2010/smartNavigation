<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Campus Navigator</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    canvas {
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-xl shadow-sm">
          <i class="fa-solid fa-compass text-xl"></i>
        </div>

        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">
            School Campus Navigator
          </h1>
          <p class="text-xs text-slate-500">
            Interactive Map & Visual Walking Directions
          </p>
        </div>
      </div>

      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
        <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span>
        Gate 2 Open
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-4 w-full flex-grow flex flex-col gap-4">

    <!-- Navigation Panel -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
      <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">

        <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

          <!-- Starting Point -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
              Starting Point
            </label>

            <div class="relative flex items-center">
              <i class="fa-solid fa-location-dot absolute left-3 text-emerald-600"></i>

              <select id="startSelect" onchange="onSelectionChange()"
                class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                <option value="" disabled selected>Select starting point...</option>
                <option value="gate2">Gate 2 (Main Entrance)</option>
                <option value="bigHall">Mary Ward Hall</option>
                <option value="newHall">Delphine Hart Hall</option>
                <option value="languages">Languages</option>
                <option value="art">Art</option>
                <option value="chemistry">Chemistry</option>
                <option value="history">History</option>
              </select>

              <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- Destination -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
              Destination
            </label>

            <div class="relative flex items-center">
              <i class="fa-solid fa-flag-checkered absolute left-3 text-rose-600"></i>

              <select id="endSelect" onchange="onSelectionChange()"
                class="w-full pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500 appearance-none cursor-pointer">
                <option value="" disabled selected>Select destination...</option>
                <option value="bigHall">Mary Ward Hall</option>
                <option value="newHall">Delphine Hart Hall</option>
                <option value="languages">Languages</option>
                <option value="art">Art</option>
                <option value="chemistry">Chemistry</option>
                <option value="history">History</option>
                <option value="gate2">Gate 2 (Main Entrance)</option>
              </select>

              <i class="fa-solid fa-chevron-down absolute right-3 text-xs text-slate-400 pointer-events-none"></i>
            </div>
          </div>

          <!-- Subject -->
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">
              Subject
            </label>

            <input
              id="subjectInput"
              type="text"
              list="subjectOptions"
              oninput="onSubjectInput()"
              placeholder="Type a subject..."
              class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-500"
            >

            <datalist id="subjectOptions">
              <option value="Political Science and Sociology">
              <option value="Economics">
              <option value="Business Studies and Entrepreneurship">
              <option value="Mathematics">
              <option value="Accounts">
              <option value="Computer Science">
              <option value="Artificial Intelligence">
              <option value="Home Science">
              <option value="Psychology">
              <option value="Physical Education">
              <option value="Geography">
              <option value="Biology">
              <option value="Physics">
              <option value="Foreign Languages">
              <option value="English">
              <option value="Hindi">
              <option value="French">
              <option value="German">
              <option value="Bengali">
              <option value="Chemistry">
              <option value="Arts">
              <option value="History">
            </datalist>
          </div>

        </div> <!-- Navigation fields grid -->

        <!-- Buttons -->
        <div class="flex items-end gap-2 pt-1 md:pt-0">
          <button id="showPathBtn" onclick="calculateRoute()"
            class="flex-1 md:flex-initial px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-route"></i>
            <span>Show Route</span>
          </button>

          <button id="takeMeBtn" onclick="openStepViewer()" disabled
            class="px-5 py-2.5 bg-slate-800 hover:bg-slate-900 disabled:opacity-50 text-white font-semibold text-sm rounded-xl shadow-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-shoe-prints"></i>
            <span>Take Me (Photo Guide)</span>
          </button>
        </div>
      </div>

      <!-- Alert -->
      <div id="msgBox"
        class="hidden mt-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm flex items-center gap-2">
        <i class="fa-solid fa-circle-info text-amber-600"></i>
        <span id="msgText">Please select two different locations.</span>
      </div>
    </div>

    <!-- Map -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden flex-grow flex items-center justify-center min-h-[460px]">
      <canvas id="campusCanvas" width="1000" height="720"
        class="max-w-full rounded-xl bg-slate-50 border border-slate-100">
      </canvas>
    </div>
  </main>

  <!-- Photo Guide Modal -->
  <div id="photoModal"
    class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">

    <div class="bg-white rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">

      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <h3 id="modalTitle" class="font-bold text-slate-900 text-base">
            Route Navigation
          </h3>
          <p id="modalSubtitle" class="text-xs text-slate-500">
            Step 1 of 3
          </p>
        </div>

        <button onclick="closeStepViewer()"
          class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="p-5 flex-grow overflow-y-auto flex flex-col gap-4">

        <div class="relative w-full h-64 sm:h-80 bg-slate-100 rounded-2xl overflow-hidden border border-slate-200 flex items-center justify-center">
          <img id="modalImg" src="" alt="Route step visual"
            class="w-full h-full object-cover">
        </div>

        <div class="p-4 bg-blue-50/70 rounded-2xl border border-blue-100 flex items-start gap-3">
          <div class="bg-blue-600 text-white rounded-xl w-8 h-8 flex-shrink-0 flex items-center justify-center font-bold text-sm">
            <span id="stepNumber">1</span>
          </div>

          <div>
            <h4 class="font-bold text-slate-900 text-sm mb-0.5">Instruction</h4>
            <p id="modalInstruction" class="text-sm text-slate-700 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-slate-100 flex items-center justify-between bg-white">
        <button id="prevStepBtn" onclick="changeStep(-1)"
          class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-sm rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Previous
        </button>

        <span id="stepCounterText" class="text-xs font-semibold text-slate-400">
          Step 1 / 3
        </span>

        <button id="nextStepBtn" onclick="changeStep(1)"
          class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl flex items-center gap-2">
          Next <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('campusCanvas');
  const ctx = canvas.getContext('2d');
  const TOP_CORRIDOR_Y = 154;
  const LOWER_PASSAGE_Y = 490;
  const EAST_LOOP_X = 524;
  const DOOR_X = 232;
  const DOOR_Y = 515;

  const locs = {
    gate2: { name: "Gate 2", x: 131, y: 60 },
    gate3: { name: "Gate 3 (Closed)", x: 900, y: 60 },
    bigHall: { name: "Mary Ward Hall", x: 362, y: 355 },
    newHall: { name: "Delphine Hart Hall", x: 115, y: 600 },
    languages: { name: "Languages", x: 531, y: 92 },
    art: { name: "Art", x: 618, y: 92 },
    chemistry: { name: "Chemistry", x: 706, y: 92 },
    history: { name: "History", x: 806, y: 92 }
  };

  let activePoints = [];
  let activeRouteSteps = [];
  let currentStepIdx = 0;
  let animFrame = null;

  // Draw small shutter marks along a wall/edge.
  function shutters(x1, y1, x2, y2, count) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const length = Math.hypot(dx, dy);
    if (length === 0 || count <= 0) return;

    const nx = -dy / length;
    const ny = dx / length;
    const shutterLength = 10;

    ctx.strokeStyle = '#8a7e66';
    ctx.lineWidth = 2;

    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      const x = x1 + dx * t;
      const y = y1 + dy * t;
      ctx.beginPath();
      ctx.moveTo(x - nx * shutterLength / 2, y - ny * shutterLength / 2);
      ctx.lineTo(x + nx * shutterLength / 2, y + ny * shutterLength / 2);
      ctx.stroke();
    }
  }

  function drawCampusMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const box = (x, y, w, h, fill, stroke, lw) => {
      if (fill) { ctx.fillStyle = fill; ctx.fillRect(x, y, w, h); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.strokeRect(x, y, w, h); }
    };

    const line = (x1, y1, x2, y2, color, lw, dash) => {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.setLineDash(dash || []);
      ctx.stroke();
      ctx.setLineDash([]);
    };

    const ring = (x, y, r, color, lw) => {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = lw;
      ctx.stroke();
    };

    const label = (text, x, y, color, size, align) => {
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px Inter, sans-serif`;
      ctx.textAlign = align || 'left';
      ctx.fillText(text, x, y);
      ctx.textAlign = 'left';
    };

    const court = (x, y, w, h, r, kw, kh) => {
      const cx = x + w / 2;
      const cy = y + h / 2;
      box(x, y, w, h, null, '#f3e8da', 2);
      line(cx, y, cx, y + h, '#f3e8da', 2);
      ring(cx, cy, r, '#f3e8da', 2);
      box(x, cy - kh / 2, kw, kh, 'rgba(231,210,195,0.6)', '#f3e8da', 2);
      box(x + w - kw, cy - kh / 2, kw, kh, 'rgba(231,210,195,0.6)', '#f3e8da', 2);
      box(x - 5, cy - 10, 5, 20, '#4b5563');
      box(x + w, cy - 10, 5, 20, '#4b5563');
    };

    // Ground and boundary wall
    box(0, 0, canvas.width, canvas.height, '#e6eadf');
    box(19, 19, 962, 682, '#e2ddd0', '#b5174f', 5);

    // One connected court floor
    ctx.beginPath();
    ctx.moveTo(50, 135);
    ctx.lineTo(815, 135);
    ctx.lineTo(815, 475);
    ctx.lineTo(530, 475);
    ctx.lineTo(530, 265);
    ctx.lineTo(200, 265);
    ctx.lineTo(200, 434);
    ctx.lineTo(50, 434);
    ctx.closePath();
    ctx.fillStyle = '#c27565';
    ctx.fill();
    ctx.strokeStyle = '#f1e6d6';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Corridor walls on the left
    line(52, 135, 52, 434, '#f3ecda', 5);
    line(93, 135, 93, 434, '#f3ecda', 5);

    // Three basketball courts
    court(250, 158, 230, 94, 18, 40, 54);
    court(548, 148, 250, 150, 24, 48, 70);
    court(548, 312, 250, 150, 24, 48, 70);

    // Block A
    box(181, 70, 681, 65, '#d9cfb9');
    shutters(184, 130, 860, 130, 6);
    box(175, 60, 681, 65, '#b9c0ca', '#f3eee2', 3);
    line(181, 92, 475, 92, '#cfd5dd', 1.5);
    box(481, 60, 100, 65, '#aab2be', '#f3eee2', 2);
    box(581, 60, 75, 65, '#aab2be', '#f3eee2', 2);
    box(656, 60, 100, 65, '#aab2be', '#f3eee2', 2);
    box(756, 60, 100, 65, '#aab2be', '#f3eee2', 2);
    label('Block A Corridor', 231, 98, '#1f2937', 17);
    label('Languages', 531, 98, '#1f2937', 17, 'center');
    label('Art', 618, 98, '#1f2937', 17, 'center');
    label('Chemistry', 706, 98, '#1f2937', 17, 'center');
    label('History', 806, 98, '#1f2937', 17, 'center');

    // Gates
    box(88, 10, 87, 115, '#3b82f6', '#1d4ed8', 2.5);
    box(88, 10, 11, 20, '#334155');
    box(164, 10, 11, 20, '#334155');
    box(99, 13, 65, 6, '#334155');
    label('Gate 2', 131, 78, '#ffffff', 17, 'center');

    box(856, 10, 88, 115, '#a3afc0', '#64748b', 2.5);
    box(856, 10, 11, 20, '#334155');
    box(933, 10, 11, 20, '#334155');
    box(867, 13, 66, 6, '#334155');
    label('Gate 3', 900, 70, '#1e293b', 17, 'center');
    label('(Closed)', 900, 92, '#1e293b', 17, 'center');

    // Stairs
    box(369, 125, 56, 27, '#f3ecda', '#8a7e66', 2);
    line(373, 138, 421, 138, '#b9ae96', 18, [3, 5]);
    label('Stairs', 360, 146, '#ffffff', 17, 'right');

    // Mary Ward Hall
    box(218, 275, 300, 169, '#d9cfb9');
    line(515, 279, 515, 441, '#58a86a', 5, [8, 10]);
    shutters(221, 439, 512, 439, 6);
    box(212, 265, 300, 169, '#f3ecda', '#8a7e66', 2.5);
    box(220, 273, 284, 153, '#c7ccd3', '#e3e6ea', 1.5);
    box(331, 255, 50, 10, '#f3ecda', '#8a7e66', 2.5);
    box(331, 434, 50, 10, '#f3ecda', '#8a7e66', 2.5);
    box(222, 275, 27, 27, '#e59a45', '#8a4b10', 1.5);
    line(222, 275, 249, 302, '#8a4b10', 1.5);
    line(249, 275, 222, 302, '#8a4b10', 1.5);
    label('Mary Ward Hall', 362, 355, '#1e293b', 18, 'center');

    // Fire escape (corner of Mary Ward Hall and the playground)
    box(474, 444, 38, 32, '#4b5563', '#1f2937', 2);
    ctx.beginPath();
    ctx.moveTo(478, 448);
    ctx.lineTo(508, 456);
    ctx.lineTo(478, 464);
    ctx.lineTo(508, 472);
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    label('Fire escape', 466, 466, '#334155', 16, 'right');

    // Delphine Hart Hall
    box(43, 444, 175, 243, '#d9cfb9');
    shutters(46, 682, 215, 682, 6);
    box(37, 434, 175, 243, '#f3ecda', '#8a7e66', 2.5);
    box(45, 442, 159, 227, '#d7c3cb');
    box(56, 544, 131, 131, '#c9a3b6');
    box(50, 534, 131, 131, '#f0d6e3', '#8a7e66', 2.5);
    label('Delphine Hart', 115, 595, '#4a1d36', 16.5, 'center');
    label('Hall', 115, 618, '#4a1d36', 16.5, 'center');
    box(202, 419, 23, 28, '#f3ecda', '#8a7e66', 2);
    box(212, 496, 10, 38, '#86d13f', '#8a7e66', 2);

    // Playgrounds
    box(245, 505, 245, 163, '#9ed08a', '#4d8f48', 3);
    box(257, 517, 221, 25, '#add99a');
    box(257, 567, 221, 25, '#add99a');
    box(257, 617, 221, 25, '#add99a');
    label('Playground', 367, 560, '#14532d', 18, 'center');

    box(502, 505, 125, 163, '#9ed08a', '#4d8f48', 3);
    box(527, 532, 75, 53, null, '#e0a82e', 4);
    line(552, 532, 552, 585, '#e0a82e', 3);
    line(577, 532, 577, 585, '#e0a82e', 3);
    line(527, 558, 602, 558, '#e0a82e', 3);
    label('Playground', 564, 647, '#14532d', 16.5, 'center');

    // Block B
    box(837, 275, 138, 356, '#d9cfb9');
    line(972, 279, 972, 617, '#58a86a', 5, [8, 10]);
    shutters(840, 626, 972, 626, 6);
    box(831, 265, 138, 356, '#8fd0c6', '#f3eee2', 3);
    line(900, 270, 900, 616, '#b5e2da', 2);
    box(845, 280, 16, 180, '#5f9a94');
    box(873, 300, 16, 140, '#5f9a94');
    label('Block B', 900, 535, '#0f3d38', 18, 'center');

    // Canteen
    box(668, 519, 150, 112, '#d9a574');
    box(662, 509, 150, 112, '#eaa877', '#b45309', 2.5);
    box(672, 519, 130, 92, null, '#f5c9a2', 1.5);
    label('Canteen', 737, 570, '#7c2d12', 18, 'center');

    // Route
    if (activePoints.length > 1) {
      ctx.beginPath();
      ctx.moveTo(activePoints[0].x, activePoints[0].y);

      for (let i = 1; i < activePoints.length; i++) {
        ctx.lineTo(activePoints[i].x, activePoints[i].y);
      }

      ctx.strokeStyle = '#facc15'; // Yellow route
      ctx.lineWidth = 5;
      ctx.setLineDash([10, 8]);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      ctx.arc(activePoints[0].x, activePoints[0].y, 7, 0, Math.PI * 2);
      ctx.fillStyle = '#16a34a';
      ctx.fill();

      const last = activePoints[activePoints.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#facc15';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  function buildRoute(start, end) {
    const p1 = locs[start];
    const p2 = locs[end];
    const classRooms = ['languages', 'art', 'chemistry', 'history'];

    if (start === 'gate2' && end === 'bigHall') {
      return [
        { x: 131, y: 130 },
        { x: 131, y: TOP_CORRIDOR_Y },
        { x: 356, y: TOP_CORRIDOR_Y },
        { x: 356, y: 255 }
      ];
    }

    // Delphine Hart Hall <-> Gate 2 (first picture)
    if ((start === 'gate2' && end === 'newHall') || (start === 'newHall' && end === 'gate2')) {
      const route = [
        { x: 131, y: 130 },
        { x: 131, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: DOOR_X, y: LOWER_PASSAGE_Y },
        { x: DOOR_X, y: DOOR_Y }
      ];
      return start === 'gate2' ? route : [...route].reverse();
    }

    // Delphine Hart Hall <-> Mary Ward Hall (second picture)
    if ((start === 'bigHall' && end === 'newHall') || (start === 'newHall' && end === 'bigHall')) {
      const route = [
        { x: DOOR_X, y: DOOR_Y },
        { x: DOOR_X, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: 258 },
        { x: 318, y: 258 },
        { x: 318, y: 292 }
      ];
      return start === 'newHall' ? route : [...route].reverse();
    }

    if (start === 'newHall' && classRooms.includes(end)) {
      return [
        { x: DOOR_X, y: DOOR_Y },
        { x: DOOR_X, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: EAST_LOOP_X, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: 128 }
      ];
    }

    if (end === 'newHall' && classRooms.includes(start)) {
      return [
        { x: p1.x, y: 128 },
        { x: p1.x, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: TOP_CORRIDOR_Y },
        { x: EAST_LOOP_X, y: LOWER_PASSAGE_Y },
        { x: DOOR_X, y: LOWER_PASSAGE_Y },
        { x: DOOR_X, y: DOOR_Y }
      ];
    }

    if (start === 'gate2' && classRooms.includes(end)) {
      return [
        { x: 131, y: 92 },
        { x: p2.x, y: 92 }
      ];
    }

    if (start === 'bigHall' && classRooms.includes(end)) {
      return [
        { x: 356, y: 255 },
        { x: 356, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: TOP_CORRIDOR_Y },
        { x: p2.x, y: 128 }
      ];
    }

    if (end === 'bigHall' && classRooms.includes(start)) {
      return [
        { x: p1.x, y: 128 },
        { x: p1.x, y: TOP_CORRIDOR_Y },

  function normalizeSubject(value) {
    return value.toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function editDistance(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);

    for (let i = 1; i <= a.length; i++) {
      let diagonal = row[0];
      row[0] = i;

      for (let j = 1; j <= b.length; j++) {
        const above = row[j];
        row[j] = Math.min(
          row[j] + 1,
          row[j - 1] + 1,
          diagonal + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
        diagonal = above;
      }
    }

    return row[b.length];
  }

  function onSubjectInput() {
    const typed = normalizeSubject(document.getElementById("subjectInput").value);
    if (!typed) return;

    let bestMatch = null;
    let bestDistance = Infinity;

    for (const item of subjectDestinations) {
      for (const alias of item.aliases) {
        const normalizedAlias = normalizeSubject(alias);
        const distance = editDistance(typed, normalizedAlias);
        const allowedErrors = typed.length >= 8 ? 2 : 1;

        if (
          (normalizedAlias.includes(typed) && typed.length >= 3) ||
          distance <= allowedErrors
        ) {
          if (distance < bestDistance) {
            bestDistance = distance;
            bestMatch = item;
          }
        }
      }
    }

    if (bestMatch) {
      document.getElementById("endSelect").value = bestMatch.destination;
      onSelectionChange();
    }
  }

    function onSelectionChange() {
    document.getElementById('takeMeBtn').disabled = true;

  function calculateRoute() {
    const start = document.getElementById('startSelect').value;
    const end = document.getElementById('endSelect').value;

    const msgBox = document.getElementById('msgBox');
    const msgText = document.getElementById('msgText');
    const takeMeBtn = document.getElementById('takeMeBtn');

    if (!start || !end) {
      msgText.innerText = 'Please select both a starting point and a destination.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
      activePoints = [];
      activeRouteSteps = [];
      drawCampusMap();
      return;
    }

    if (start === end) {
      msgText.innerText = 'Please select two different locations to calculate the route.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
      activePoints = [];
      activeRouteSteps = [];
      drawCampusMap();
      return;
    }

    if (end === 'gate2') {
      msgText.innerText = 'Photo guide currently unavailable for Gate 2. Please follow the straight corridor path shown on the map.';
      msgBox.classList.remove('hidden');
      takeMeBtn.disabled = true;
    } else {
      msgBox.classList.add('hidden');
      takeMeBtn.disabled = false;
    }

    let points = buildRoute(start, end);

    if (start !== 'gate2' && end !== 'gate2' &&
        start !== 'newHall' && end !== 'newHall' &&
        start !== 'bigHall' && end !== 'bigHall') {
      points = [
        { x: locs[start].x, y: locs[start].y },
        { x: locs[start].x, y: TOP_CORRIDOR_Y },
        { x: locs[end].x, y: TOP_CORRIDOR_Y },
        { x: locs[end].x, y: locs[end].y }
      ];
    }

    activePoints = points;
    activeRouteSteps = createSteps(start, end, points);

    animatePath(points);
  }

  function animatePath(points) {
    if (animFrame) cancelAnimationFrame(animFrame);

    let segment = 0;
    let progress = 0;

    function step() {
      drawCampusMap();

      if (points.length < 2) return;

      if (segment < points.length - 1) {
        const p1 = points[segment];
        const p2 = points[segment + 1];

        const currX = p1.x + (p2.x - p1.x) * progress;
        const currY = p1.y + (p2.y - p1.y) * progress;

        ctx.beginPath();
        ctx.arc(currX, currY, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#2563eb';
        ctx.fill();

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        progress += 0.04;

        if (progress >= 1) {
          progress = 0;
          segment++;
        }

        animFrame = requestAnimationFrame(step);
      } else {
        segment = 0;
        progress = 0;
        animFrame = requestAnimationFrame(step);
      }
    }

    step();
  }

  function openStepViewer() {
    if (!activeRouteSteps.length) return;

    currentStepIdx = 0;

    currentStepIdx += dir;

      currentStepIdx = 0;
    }

    if (currentStepIdx >= activeRouteSteps.length) {
      currentStepIdx = activeRouteSteps.length - 1;
    }

    updateModalStep();
  }

  function updateModalStep() {
    const step = activeRouteSteps[currentStepIdx];
    const startVal = document.getElementById('startSelect').value;
    const endVal = document.getElementById('endSelect').value;

    const startName = locs[startVal] ? locs[startVal].name : startVal;
    const endName = locs[endVal] ? locs[endVal].name : endVal;

    document.getElementById('modalTitle').innerText = `${startName} ➔ ${endName}`;
    document.getElementById('modalSubtitle').innerText = `Step ${currentStepIdx + 1} of ${activeRouteSteps.length}`;
    document.getElementById('stepNumber').innerText = currentStepIdx + 1;
    document.getElementById('modalInstruction').innerText = step.text;
    document.getElementById('stepCounterText').innerText = `Step ${currentStepIdx + 1} / ${activeRouteSteps.length}`;

    const imgEl = document.getElementById('modalImg');
    const imageText = encodeURIComponent(step.fallbackText || 'Route step');
    const placeholderSrc = `https://placehold.co/600x400/2563eb/ffffff?text=${imageText}`;

    imgEl.alt = step.fallbackText || 'Route step visual';
    imgEl.onerror = function() {
      imgEl.onerror = null;
      imgEl.src = placeholderSrc;
    };
    imgEl.src = step.image || placeholderSrc;

    document.getElementById('prevStepBtn').disabled = (currentStepIdx === 0);
    document.getElementById('nextStepBtn').disabled = (currentStepIdx === activeRouteSteps.length - 1);
  }
